name: Frontend CI

on:
  push:
    paths:
      - 'frontend-mobile/**'
  pull_request:
    paths:
      - 'frontend-mobile/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend-mobile

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend-mobile/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Run lint
      run: npm run lint
      continue-on-error: true # Continue if lint fails for now, can be tightened later

    - name: Run tests
      run: npm test
